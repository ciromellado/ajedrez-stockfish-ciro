<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b58863">
  <!-- PWA: Manifest y registro del Service Worker -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('✅ Service Worker registrado'))
        .catch(err => console.log('❌ Error al registrar SW:', err));
    });
  }
</script>
  <title>Ajedrez Liviano Ciro</title>
  
  <style>
    :root {
      --bg-dark: #2c2520;
      --bg-panel: #3a322b;
      --board-light: #f0d9b5;
      --board-dark: #b58863;
      --highlight: rgba(255, 255, 0, 0.4);
      --selected: rgba(105, 180, 255, 0.6);
      --text-light: #f3f3f3;
      --accent: #d99b43;
      --accent-hover: #b87f32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 500px;
      width: 100%;
      gap: 15px;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--accent);
      text-align: center;
    }

    .controls {
      background: var(--bg-panel);
      padding: 12px 16px;
      border-radius: 10px;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .controls label {
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .controls select, .controls button {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background-color: #4a4138;
      color: var(--text-light);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .controls select:focus, .controls button:hover {
      background-color: #5c5248;
    }

    .controls button {
      grid-column: span 1;
      background-color: var(--accent);
      color: #1a1613;
      font-weight: bold;
    }

    .controls button:hover {
      background-color: var(--accent-hover);
    }

    #undo-move {
      background-color: #5c6b73;
      color: #ffffff;
    }

    #undo-move:hover {
      background-color: #48545b;
    }

    .chess-board {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      border: 4px solid #4a3e35;
      touch-action: manipulation;
    }

    .square {
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: background-color 0.15s ease;
    }

    .square.light { background-color: var(--board-light); }
    .square.dark { background-color: var(--board-dark); }
    .square.selected { background-color: var(--selected) !important; }
    .square.last-move { background-color: var(--highlight) !important; }

    .square.highlight::after {
      content: "";
      position: absolute;
      width: 25%;
      height: 25%;
      background-color: rgba(0, 0, 0, 0.25);
      border-radius: 50%;
    }

    /* ═══════════════════════════════════════════════════════════
       ESTILO DE LAS PIEZAS SVG
       ═══════════════════════════════════════════════════════════ */
    .piece-svg {
      width: 88%;
      height: 88%;
      filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.5));
      transition: transform 0.1s ease;
    }
    .square:hover .piece-svg {
      transform: scale(1.08);
    }
    
    /* Piezas BLANCAS: relleno blanco, borde negro */
    .piece-svg.white { 
      fill: #ffffff; 
      stroke: #222222; 
      stroke-width: 1.5px; 
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    
    /* Piezas NEGRAS: relleno negro, borde blanco/gris */
    .piece-svg.black { 
      fill: #1a1a1a; 
      stroke: #e0e0e0; 
      stroke-width: 1px; 
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    #status {
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      color: #e2b97c;
      min-height: 1.5em;
    }

    .move-counter {
      font-size: 0.9rem;
      color: #a09386;
    }

    .move-history {
      background: var(--bg-panel);
      width: 100%;
      max-height: 100px;
      overflow-y: auto;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #ccc;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-item {
      background: rgba(0,0,0,0.2);
      padding: 2px 6px;
      border-radius: 4px;
    }

    @media (max-width: 400px) {
      .controls { grid-template-columns: 1fr; }
      .controls button { grid-column: span 1; }
    }
  </style>

  <script src="chess.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>♟ Ajedrez Liviano Ciro</h1>

    <div class="controls">
      <div>
        <label for="level-select">Nivel:</label>
        <select id="level-select">
          <option value="600">🟢 Principiante (600)</option>
          <option value="800">🟢 Iniciado (800)</option>
          <option value="1000">🟡 Básico (1000)</option>
          <option value="1200" selected>🟡 Intermedio (1200)</option>
          <option value="1400">🟠 Intermedio+ (1400)</option>
          <option value="1600">🟠 Avanzado (1600)</option>
          <option value="1800">🔵 Avanzado+ (1800)</option>
          <option value="2000">🔵 Experto (2000)</option>
          <option value="2200">🔴 Experto+ (2200)</option>
          <option value="2400">🔴 Maestro (2400)</option>
          <option value="2500">👑 Gran Maestro (2500)</option>
        </select>
      </div>

      <div>
        <label for="color-select">Color:</label>

          <option value="w">⬜ Blancas</option>
          <option value="b">⬛ Negras</option>
          <option value="random">🎲 Aleatorio</option>

      <button id="new-game">Nueva partida</button>
      <button id="undo-move">↩ Devolver jugada</button>
    </div>

    <div id="board" class="chess-board"></div>
    <div id="status">Tu turno (blancas)</div>
    <div id="move-counter" class="move-counter">Jugada: 0</div>
    <div id="move-history" class="move-history"></div>
  </div>

    function getPieceHTML(type, color) {
      const colorKey = color === 'w' ? 'w' : 'b';
      const svg = PIECE_SVGS[colorKey][type];
      return svg || '';
    }

    let game = new Chess();
    let playerColor = 'w';
    let selectedSquare = null;
    let possibleMoves = [];
    let lastMove = null;
    let engineWorker = null;
    let isEngineThinking = false;

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const moveCounterEl = document.getElementById('move-counter');
    const moveHistoryEl = document.getElementById('move-history');
    const levelSelect = document.getElementById('level-select');
    const colorSelect = document.getElementById('color-select');
    const newGameBtn = document.getElementById('new-game');
    const undoBtn = document.getElementById('undo-move');

    function initStockfish() {
      if (engineWorker) engineWorker.terminate();
      const workerCode = `importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');`;
      const blob = new Blob([workerCode], { type: 'application/javascript' });
      engineWorker = new Worker(URL.createObjectURL(blob));

      engineWorker.onmessage = function (e) {
        const line = e.data;
        if (line.startsWith('bestmove')) {
          const moveMatch = line.match(/^bestmove\s([a-h][1-8][a-h][1-8][qrbn]?)/);
          if (moveMatch && isEngineThinking) {
            makeEngineMove(moveMatch[1]);
          }
          isEngineThinking = false;
        }
      };
      engineWorker.postMessage('uci');
      engineWorker.postMessage('isready');
    }

    function triggerEngineMove() {
      if (game.game_over() || isEngineThinking) return;
      isEngineThinking = true;
      statusEl.textContent = '🧠 Pensando...';

      const elo = parseInt(levelSelect.value, 10);
      let skillLevel = 0, depth = 1, moveTime = 100;

      if (elo <= 600)      { skillLevel = 0;  depth = 1;  moveTime = 100; }
      else if (elo <= 800) { skillLevel = 2;  depth = 2;  moveTime = 200; }
      else if (elo <= 1000){ skillLevel = 4;  depth = 3;  moveTime = 300; }
      else if (elo <= 1200){ skillLevel = 6;  depth = 4;  moveTime = 400; }
      else if (elo <= 1400){ skillLevel = 8;  depth = 5;  moveTime = 500; }
      else if (elo <= 1600){ skillLevel = 10; depth = 7;  moveTime = 700; }
      else if (elo <= 1800){ skillLevel = 12; depth = 9;  moveTime = 900; }
      else if (elo <= 2000){ skillLevel = 14; depth = 11; moveTime = 1200; }
      else if (elo <= 2200){ skillLevel = 16; depth = 13; moveTime = 1500; }
      else if (elo <= 2400){ skillLevel = 18; depth = 15; moveTime = 2000; }
      else                 { skillLevel = 20; depth = 18; moveTime = 3000; }

      engineWorker.postMessage('position fen ' + game.fen());
      engineWorker.postMessage(`setoption name Skill Level value ${skillLevel}`);
      engineWorker.postMessage(`go depth ${depth} movetime ${moveTime}`);
    }

    function makeEngineMove(moveString) {
      const from = moveString.substring(0, 2);
      const to = moveString.substring(2, 4);
      const promotion = moveString.length === 5 ? moveString.charAt(4) : 'q';
      const move = game.move({ from, to, promotion });
      if (move) {
        lastMove = { from: move.from, to: move.to };
        updateUI();
      }
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      const isFlipped = playerColor === 'b';

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const r = isFlipped ? row : 7 - row;
          const c = isFlipped ? 7 - col : col;
          const squareName = String.fromCharCode(97 + c) + (r + 1);
          const squareEl = document.createElement('div');
          
          squareEl.className = `square ${(r + c) % 2 === 0 ? 'dark' : 'light'}`;
          squareEl.dataset.square = squareName;

          if (selectedSquare === squareName) squareEl.classList.add('selected');
          if (possibleMoves.includes(squareName)) squareEl.classList.add('highlight');
          if (lastMove && (lastMove.from === squareName || lastMove.to === squareName)) {
            squareEl.classList.add('last-move');
          }

          const piece = game.get(squareName);
          if (piece) {
            const pieceEl = document.createElement('div');
            pieceEl.className = 'piece';
            pieceEl.innerHTML = getPieceHTML(piece.type, piece.color);
            squareEl.appendChild(pieceEl);
          }

          squareEl.addEventListener('click', () => handleSquareClick(squareName));
          boardEl.appendChild(squareEl);
        }
      }
    }

    function handleSquareClick(square) {
      if (game.game_over() || isEngineThinking) return;
      const turn = game.turn();
      if (turn !== playerColor) return;

      if (selectedSquare && possibleMoves.includes(square)) {
        const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
        if (move) {
          lastMove = { from: move.from, to: move.to };
          selectedSquare = null;
          possibleMoves = [];
          updateUI();
          setTimeout(triggerEngineMove, 250);
          return;
        }
      }

      const piece = game.get(square);
      if (piece && piece.color === playerColor) {
        selectedSquare = square;
        const moves = game.moves({ square: square, verbose: true });
        possibleMoves = moves.map(m => m.to);
      } else {
        selectedSquare = null;
        possibleMoves = [];
      }
      renderBoard();
    }

    function updateUI() {
      renderBoard();
      let statusText = '';
      const turnName = game.turn() === 'w' ? 'Blancas' : 'Negras';

      if (game.in_checkmate()) {
        statusText = `¡Jaque mate! Ganaron las ${game.turn() === 'w' ? 'Negras' : 'Blancas'}.`;
      } else if (game.in_draw()) {
        statusText = '¡Empate / Tablas!';
      } else if (game.in_check()) {
        statusText = `¡Jaque! Turno de ${turnName}.`;
      } else {
        const isPlayerTurn = game.turn() === playerColor;
        statusText = isPlayerTurn ? `Tu turno (${turnName})` : `Turno del motor...`;
      }
      statusEl.textContent = statusText;

      const history = game.history();
      moveCounterEl.textContent = `Jugada: ${Math.ceil(history.length / 2)}`;

      moveHistoryEl.innerHTML = '';
      for (let i = 0; i < history.length; i += 2) {
        const moveNum = Math.floor(i / 2) + 1;
        const whiteMove = history[i];
        const blackMove = history[i + 1] || '';
        const item = document.createElement('div');
        item.className = 'history-item';
        item.textContent = `${moveNum}. ${whiteMove} ${blackMove}`;
        moveHistoryEl.appendChild(item);
      }
      moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
    }

    function startNewGame() {
      game.reset();
      selectedSquare = null;
      possibleMoves = [];
      lastMove = null;
      isEngineThinking = false;

      let chosenColor = colorSelect.value;
      if (chosenColor === 'random') {
        chosenColor = Math.random() < 0.5 ? 'w' : 'b';
      }
      playerColor = chosenColor;
      updateUI();

      if (playerColor === 'b') {
        setTimeout(triggerEngineMove, 400);
      }
    }

    function undoMove() {
      if (isEngineThinking) return;
      if (game.turn() === playerColor) {
        game.undo(); 
        game.undo(); 
      } else {
        game.undo();
      }
      selectedSquare = null;
      possibleMoves = [];
      lastMove = null;
      updateUI();
    }

    newGameBtn.addEventListener('click', startNewGame);
    undoBtn.addEventListener('click', undoMove);

    window.onload = function() {
      initStockfish();
      startNewGame();
    };
  </script>
</body>
</html>
